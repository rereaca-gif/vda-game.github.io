<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выход из ТЕНИ</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #34c759; font-size: 22px; }
        .card { background-color: #2c2c2e; border: 2px solid #3a3a3c; border-radius: 14px; padding: 20px; margin-bottom: 20px; text-align: left; }
        .badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; color: white; background-color: #ffd60a; color: #000; }
        .sub-badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; color: white; margin-bottom: 10px; }
        .bg-reason { background-color: #007aff; }
        .bg-emotion { background-color: #af52de; }
        .bg-body { background-color: #ff9500; }
        .bg-behavior { background-color: #34c759; }
        .question { font-style: italic; color: #ffd60a; margin-top: 15px; }
        textarea { width: 100%; height: 80px; background-color: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 10px; color: white; padding: 12px; box-sizing: border-box; margin-bottom: 15px; resize: none; }
        .btn { display: block; width: 100%; background-color: #34c759; color: white; border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background-color: #3a3a3c; color: #8e8e93; }
        .solution { background-color: #1c1c1e; border-left: 4px solid #34c759; padding: 15px; margin-top: 15px; text-align: left; border-radius: 0 8px 8px 0; }
        .expert-box { background-color: #1c1c1e; border-left: 4px solid #ffd60a; padding: 15px; margin-top: 15px; text-align: left; border-radius: 0 8px 8px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Выход из ТЕНИ</h1>
    
    <div id="start-screen">
        <div class="card" style="text-align: center;">
            <p>Вытяните карту ВДА, а затем последовательно проработайте её через 5 шагов: Разум 🧠 → Эмоции 🎭 → Тело 🌿 → Поведение 🎬 + экспертное резюме.</p>
        </div>
        <button class="btn" onclick="startGame()">Вытянуть карту ВДА 🎲</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <div class="badge">🔥 Ситвация ВДА</div>
            <div id="card-title" style="font-weight:bold; font-size:18px; margin-bottom:5px;">Название</div>
            <p id="card-text" style="margin:0;">Текст...</p>
        </div>

        <div id="layer-card" class="card hidden">
            <div id="layer-badge" class="sub-badge">Слой</div>
            <p id="layer-question" class="question" style="margin:0;"></p>
            <div id="input-block" style="margin-top:15px;">
                <textarea id="player-answer" placeholder="Зафиксируйте ваш ответ письменно..." oninput="checkInput()"></textarea>
                <button id="action-btn" class="btn" onclick="revealSolution()" disabled>Записать и увидеть Новое решение</button>
            </div>
            <div id="solution-block" class="solution hidden">
                <strong style="color:#34c759;">Новое решение РЭТП:</strong>
                <p id="solution-text" style="margin:5px 0 0 0; font-size:14px;"></p>
                <button class="btn" style="margin-top:15px;" onclick="nextLayer()">Далее ➡</button>
            </div>
        </div>

        <div id="expert-card" class="card hidden">
            <div class="expert-box">
                <strong style="color:#ffd60a;">🎓 Резюме эксперта по ситуации:</strong>
                <p id="expert-text" style="margin:5px 0 0 0; font-size:14px;"></p>
            </div>
            <button class="btn" style="margin-top:15px;" onclick="location.reload()">Начать заново 🎲</button>
        </div>
    </div>
</div>

<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
    }

    const fullDeck = [
        {
            title: "Тестовый сценарий: Критика на работе",
            text: "Начальник резко раскритиковал ваш отчет на общем рабочем собрании.",
            steps: [
                { name: "Разум 🧠", question: "Какая автоматическая мысль возникла?", solution: "Разделите поступок и личность. Ошибка в отчете не делает вас плохим человеком." }
            ],
            expertOpinion: "Выход из детской позиции Жертвы происходит через заземление в факты."
        }
    ];

    let currentLayerIdx = 0;

    function startGame() {
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        
        const card = fullDeck[0];
        document.getElementById("card-title").innerText = card.title;
        document.getElementById("card-text").innerText = card.text;
        
        currentLayerIdx = 0;
        showLayer();
    }

    function showLayer() {
        document.getElementById("layer-card").classList.remove("hidden");
        document.getElementById("input-block").classList.remove("hidden");
        document.getElementById("solution-block").classList.add("hidden");
        document.getElementById("player-answer").value = "";
        document.getElementById("action-btn").disabled = true;

        const step = fullDeck[0].steps[currentLayerIdx];
        let badge = document.getElementById("layer-badge");
        badge.innerText = step.name;
        badge.className = "sub-badge bg-reason";
        document.getElementById("layer-question").innerText = step.question;
    }

    function checkInput() {
        const text = document.getElementById("player-answer").value.trim();
        document.getElementById("action-btn").disabled = (text.length === 0);
    }

    function revealSolution() {
        document.getElementById("input-block").classList.add("hidden");
        document.getElementById("solution-text").innerText = fullDeck[0].steps[currentLayerIdx].solution;
        document.getElementById("solution-block").classList.remove("hidden");
    }

    function nextLayer() {
        document.getElementById("layer-card").classList.add("hidden");
        document.getElementById("expert-text").innerText = fullDeck[0].expertOpinion;
        document.getElementById("expert-card").classList.remove("hidden");
    }
</script>
</body>
</html>
