<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Т-Игры</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; text-align: center; padding: 50px 20px; }
        .btn { display: block; width: 100%; max-width: 300px; margin: 20px auto; background-color: #34c759; color: white; border: none; border-radius: 10px; padding: 20px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Проверка Web App</h1>
    <p>Если вы видите этот текст, экран загрузился успешно.</p>
    
    <!-- Самая простая кнопка в мире, которая просто меняет текст при нажатии -->
    <button class="btn" onclick="this.innerText='🛑 КНОПКА СРАБОТАЛА! ЖМИТЕ ДАЛЕЕ'; document.getElementById('next-box').style.display='block';">Нажми на меня 🎲</button>

    <div id="next-box" style="display: none; margin-top: 20px; color: #ffd60a;">
        <h2>🎉 УРА! Ваш телефон полностью поддерживает кнопки!</h2>
        <p>Значит, мы сможем запустить и всю Т-игру целиком!</p>
    </div>
</body>
</html>
