<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выход из ТЕНИ: Т-Игра</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #131313;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }
        h1 {
            color: #ffd60a;
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            color: #aaaaaa;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-sizing: border-box;
        }
        .btn:active {
            background-color: #248046;
        }
        .btn-secondary {
            background-color: #444444;
        }
        .btn-secondary:active {
            background-color: #333333;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Выход из ТЕНИ 🎲</h1>
        <p>Добро пожаловать в психологическую трансформационную игру. Ваше подсознание готово дать ответы.</p>
        
        <button class="btn" onclick="drawCard()">Получить карту подсказки ✨</button>
        <button class="btn btn-secondary" onclick="closeApp()">Выйти из игры 🛑</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем игру на весь экран смартфона

        function drawCard() {
            // Список глубоких метафорических подсказок
            const answers = [
                "То, что вы ищете, скрыто в вашем самом глубоком страхе.",
                "Примите свою теневую сторону — именно там скрыт ваш главный ресурс.",
                "Сделайте шаг, которого больше всего боитесь. Там ваша свобода.",
                "Перестаньте контролировать то, что от вас не зависит.",
                "Вы уже знаете правильный ответ. Доверьтесь первому импульсу."
            ];
            
            const randomIndex = Math.floor(Math.random() * answers.length);
            alert("🔮 ПОДСКАЗКА ДЛЯ ВАС:\n\n" + answers[randomIndex]);
        }

        function closeApp() {
            tg.close(); // Команда закрытия окна Web App внутри Telegram
        }
    </script>

</body>
</html>
